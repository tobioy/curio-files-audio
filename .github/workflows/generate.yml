name: Generate Curio Files episode

on:
  schedule:
    # 11:00 UTC, Monday, Wednesday, Saturday (about 7am US Eastern during daylight time).
    # Runs before the Claude side task (11:30 UTC), which reads this repo's output and
    # mirrors it into the Curio Files app, so there is time for this to finish and deploy.
    - cron: "0 11 * * 1,3,6"
  workflow_dispatch: {}  # lets you trigger a run by hand from the Actions tab, for testing

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate today's episode
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
          ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
          ONESIGNAL_SAFARI_WEB_ID: ${{ secrets.ONESIGNAL_SAFARI_WEB_ID }}
        run: python scripts/generate_episode.py

      - name: Commit and push the new episode
        run: |
          git config user.name "curio-files-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs
          git diff --cached --quiet && echo "Nothing new to commit" && exit 0
          git commit -m "Add episode for $(date -u +%Y-%m-%d)"
          git push
